name: Build KORO v0.10.0

on:
  push:
    branches: [v0.10-dev]
    paths:
      - '.github/workflows/apply-v010.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=sorted(Path('.koro_v10').glob('part_*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 patch parts, found {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          expected='c0d1640311f914f5e1cb69302949fa3ae42d6ed4eba5c34586b83a147261053b'
          print('patch SHA-256:', digest)
          if digest != expected:
              raise SystemExit(f'Patch SHA mismatch: {digest}')
          Path('/tmp/koro_v10.patch').write_bytes(data)
          PY

      - name: Apply v0.10.0 source patch
        shell: bash
        run: |
          git apply -p1 --check /tmp/koro_v10.patch
          git apply -p1 /tmp/koro_v10.patch
          rm -rf .koro_v10
          rm -f .github/workflows/apply-v010.yml

      - name: Validate extension
        shell: bash
        run: |
          grep -q 'version = "0.10.0"' blender_manifest.toml
          python -m py_compile __init__.py properties.py utils.py operators/*.py ui/*.py
          python - <<'PY'
          from pathlib import Path
          import ast,re,tomllib
          root=Path('.')
          for f in root.rglob('*.py'):
              ast.parse(f.read_text(), filename=str(f))
          m=tomllib.loads(Path('blender_manifest.toml').read_text())
          assert m['version']=='0.10.0'
          ids=set()
          for f in [Path('operators/boxcutter.py'),Path('operators/hardops.py')]:
              tree=ast.parse(f.read_text())
              for node in tree.body:
                  if isinstance(node,ast.ClassDef):
                      for st in node.body:
                          if isinstance(st,ast.Assign):
                              for target in st.targets:
                                  if isinstance(target,ast.Name) and target.id=='bl_idname' and isinstance(st.value,ast.Constant):
                                      ids.add(st.value.value)
          text=Path('ui/panel.py').read_text()+Path('operators/hardops.py').read_text()
          refs=set(re.findall(r'operator\(["\'](koro\.[^"\']+)',text))
          missing=sorted(refs-ids)
          if missing:
              raise SystemExit(f'Missing operator ids: {missing}')
          print('AST/operator validation OK')
          PY
          rm -rf __pycache__ operators/__pycache__ ui/__pycache__

      - name: Commit v0.10.0 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KORO HardOps BoxCutter v0.10.0"
          git push origin HEAD:v0.10-dev

name: Publish KORO Release

on:
  push:
    paths:
      - '.github/workflows/publish-releases.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.10.0 source
        shell: bash
        run: |
          grep -q 'version = "0.10.0"' blender_manifest.toml
          python -m py_compile __init__.py properties.py utils.py operators/*.py ui/*.py
          rm -rf __pycache__ operators/__pycache__ ui/__pycache__

      - name: Build installable v0.10.0 ZIP
        shell: bash
        run: |
          rm -f /tmp/koro_hardops_boxcutter-0.10.0.zip
          zip -q -r /tmp/koro_hardops_boxcutter-0.10.0.zip \
            README.md __init__.py blender_manifest.toml properties.py utils.py operators ui \
            -x '*/__pycache__/*' '*.pyc'
          unzip -t /tmp/koro_hardops_boxcutter-0.10.0.zip
          sha256sum /tmp/koro_hardops_boxcutter-0.10.0.zip | tee /tmp/koro-v010.sha256

      - name: Publish v0.10.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DIGEST=$(cut -d' ' -f1 /tmp/koro-v010.sha256)
          NOTES=$(cat <<EOF
          Blender 5.2+ installable extension ZIP.

          v0.10.0 adds Profile Edit Modal, expanded parametric editing, 8 scene-local user cutter presets, and batch modifier workflow across selected meshes.

          SHA-256: $DIGEST
          EOF
          )
          if gh release view v0.10.0 >/dev/null 2>&1; then
            gh release upload v0.10.0 /tmp/koro_hardops_boxcutter-0.10.0.zip --clobber
            gh release edit v0.10.0 --title "KORO HardOps + BoxCutter v0.10.0" --notes "$NOTES"
          else
            gh release create v0.10.0 /tmp/koro_hardops_boxcutter-0.10.0.zip \
              --target main \
              --title "KORO HardOps + BoxCutter v0.10.0" \
              --notes "$NOTES"
          fi

name: Import KORO v0.9.0

on:
  push:
    branches: [v0.9-dev]
    paths:
      - '.koro_upload_v09/**'
      - '.github/workflows/import-v090.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v0.9-dev

      - name: Reconstruct, verify and unpack v0.9.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zipfile, shutil

          upload = Path('.koro_upload_v09')
          names = [
              'part_00a', 'part_00b', 'part_00c', 'part_00d',
              'part_01', 'part_02', 'part_03', 'part_04',
              'part_05', 'part_06', 'part_07',
          ]
          missing = [name for name in names if not (upload / name).exists()]
          if missing:
              print('Waiting for upload parts:', ', '.join(missing))
              raise SystemExit(0)

          # part_00a lost exactly one byte in the connector payload. Its Git blob
          # matches the local segment with the character 'B' deleted at offset 1387.
          # Repair that known transfer defect before the full cryptographic check.
          first = (upload / 'part_00a').read_text(encoding='utf-8')
          if len(first) == 1999:
              first = first[:1387] + 'B' + first[1387:]
          if len(first) != 2000:
              raise SystemExit(f'Unexpected part_00a length: {len(first)}')

          encoded = first + ''.join((upload / name).read_text(encoding='utf-8') for name in names[1:])
          expected = '164d03bcfa29d855a973151ff568580b601ade1ae2b553daa4d85ed9abe485d9'
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print('ZIP SHA-256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {digest}')

          release_dir = Path('releases')
          release_dir.mkdir(exist_ok=True)
          zip_path = release_dir / 'koro_hardops_boxcutter-0.9.0.zip'
          zip_path.write_bytes(data)

          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              zf.extractall('.')

          shutil.rmtree(upload)
          Path('.github/workflows/import-v090.yml').unlink(missing_ok=True)
          PY

      - name: Commit imported source and release ZIP
        shell: bash
        run: |
          if [ -d .koro_upload_v09 ]; then
            echo "Upload is not complete yet; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Develop KORO HardOps BoxCutter v0.9.0"
          git push origin HEAD:v0.9-dev

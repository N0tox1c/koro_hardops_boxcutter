name: Import KORO v0.9.0

on:
  push:
    paths:
      - 'releases/koro_hardops_boxcutter-0.9.0.zip'
      - '.github/workflows/import-v090.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack v0.9.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          path=Path('releases/koro_hardops_boxcutter-0.9.0.zip')
          expected='164d03bcfa29d855a973151ff568580b601ade1ae2b553daa4d85ed9abe485d9'
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          print('ZIP SHA-256:', digest)
          if digest != expected:
              raise SystemExit(f'SHA mismatch: {digest}')
          with zipfile.ZipFile(path) as zf:
              bad=zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt member: {bad}')
              zf.extractall('.')
          PY
          rm -f .github/workflows/import-v090.yml
      - name: Commit v0.9.0 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import KORO HardOps BoxCutter v0.9.0 source"
          git push
